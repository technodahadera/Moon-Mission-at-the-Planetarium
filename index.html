  <style>
    :root { --space:#061128; --navy:#0a1c38; --navy2:#0d2748; --card:#122b4b; --line:rgba(159,204,235,.21); --cyan:#57d9e9; --cyan2:#22baca; --gold:#ffc84b; --orange:#f88e43; --lime:#7ed59f; --red:#fd6d77; --violet:#a18cff; --text:#f4f9ff; --muted:#acc3d9; --shadow:0 20px 55px rgba(0,0,0,.23); }
    * {box-sizing:border-box} html {scroll-behavior:smooth} body {margin:0;min-height:100vh;background:var(--space);color:var(--text);font-family:Rubik,Arial,sans-serif;font-size:16px;line-height:1.55;overflow-x:hidden}

    button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible {outline:3px solid var(--gold);outline-offset:4px}
    a {color:var(--cyan)}

    .top {min-height:86px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line)}

    .brand-title {font-size:26px;font-weight:900;line-height:1.0;letter-spacing:-.035em}.brand-sub {font-size:10px;letter-spacing:.11em;color:var(--muted);font-weight:600;margin-top:5px}
    .header-actions{display:flex;flex-wrap:wrap;align-items:center;gap:9px}.ghost-btn,.small-btn {border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);border-radius:12px;min-height:43px;padding:10px 15px;font-weight:600}.ghost-btn:hover,.small-btn:hover{background:rgba(92,199,229,.13)}.header-actions .active{background:rgba(92,199,229,.16);border-color:rgba(94,217,233,.43)}
    .connect {font-size:12px;padding:7px 11px;border:1px solid rgba(255,200,75,.35);background:rgba(255,200,75,.09);border-radius:999px;color:#ffdf86}.connect.live{color:#b2f3cd;border-color:rgba(126,213,159,.33);background:rgba(126,213,159,.09)}

    .lead {font-size:18px;color:#c5d8e9;max-width:650px;line-height:1.9;margin-bottom:24px}
    .hero-actions,.actions {display:flex;gap:12px;flex-wrap:wrap;align-items:center}.btn {display:inline-flex;gap:10px;align-items:center;justify-content:center;border:0;border-radius:14px;padding:14px 23px;min-height:52px;font-weight:800;line-height:1.3;background:linear-gradient(130deg,#49d5e8,#2c9dda);color:#07223b;box-shadow:0 8px 25px rgba(50,185,216,.16)}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn.secondary{background:#153353;color:#e6f4ff;border:1px solid rgba(102,197,220,.23);box-shadow:none}.btn.warn {background:linear-gradient(130deg,#ffdf84,#f8a657);color:#2b1a00}.btn.danger{background:#4c2334;color:#ffe0e5;border:1px solid rgba(253,109,119,.45);box-shadow:none}.btn:disabled:hover{transform:none;filter:none}
    .hero-art {min-height:360px;position:relative;display:grid;place-items:center}.moon {position:absolute;width:min(92%,390px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 33% 30%,#9bafba 0%,#567588 40%,#283f60 69%,#17283f 75%);box-shadow:inset -36px -15px 62px #07142a,0 0 90px rgba(80,178,230,.18)}.moon:before {content:"";position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle at 30% 40%,rgba(3,15,39,.3) 0 10%,transparent 10.6%),radial-gradient(circle at 62% 60%,rgba(4,16,39,.29) 0 14%,transparent 14.7%),radial-gradient(circle at 60% 26%,rgba(6,17,38,.24) 0 8%,transparent 8.5%);opacity:.85}.orb {position:absolute;border:1px solid rgba(107,223,240,.45);width:100%;height:46%;border-radius:50%;transform:rotate(-28deg)}.orb.two {width:93%;height:35%;transform:rotate(30deg);border-color:rgba(246,190,79,.25)}.sat {position:absolute;top:22%;left:11%;width:48px;height:48px;border:2px solid var(--cyan);border-radius:50%;background:var(--navy);display:grid;place-items:center;color:var(--gold);font-size:23px;box-shadow:0 0 25px rgba(34,186,202,.27)}.orbit-label{position:absolute;bottom:13%;left:2%;border-radius:12px;background:rgba(10,34,59,.92);border:1px solid var(--line);padding:13px 19px;box-shadow:var(--shadow);font-size:14px;color:var(--cyan);font-weight:800}
    .stats {display:flex;flex-wrap:wrap;gap:25px;margin-top:27px}.stat strong{font-weight:900;font-size:27px;color:white;display:block;line-height:1.2}.stat span{font-size:12px;color:var(--muted)}
    .section-head {display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:20px 0 22px}.section-head h2{font-size:28px;margin:0;font-weight:800;letter-spacing:-.025em}.section-head p{margin:8px 0 0;color:var(--muted)}
    .station-grid {display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px}
    .station-card {background:linear-gradient(180deg,rgba(24,54,83,.83),rgba(12,31,56,.92));border:1px solid var(--line);border-radius:20px;padding:11px;min-width:0;position:relative;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,.12);transition:transform .18s,border-color .18s}.station-card:hover{transform:translateY(-4px);border-color:rgba(91,213,232,.55)}.station-card.completed{border-color:rgba(126,213,159,.55)}.station-cover{position:relative;aspect-ratio:1;overflow:hidden;border-radius:12px;background:#09233e}.station-cover img{width:100%;height:100%;object-fit:cover;display:block}.station-num{position:absolute;top:9px;right:9px;background:#071c37d9;border:1px solid #76e6ef80;border-radius:10px;font-weight:900;font-size:13px;padding:5px 8px}.done-dot{position:absolute;top:10px;left:10px;background:#2b8e68;color:white;border-radius:20px;font-size:12px;padding:5px 8px}.station-info{padding:12px 6px 8px}.station-info strong{display:block;font-size:17px;line-height:1.35;min-height:44px}.station-info p{font-size:12px;color:var(--muted);min-height:38px;margin:7px 0 13px}.station-card .small-btn{width:100%;font-size:13px}
    .block {border:1px solid var(--line);border-radius:20px;background:rgba(14,37,64,.88);box-shadow:var(--shadow);padding:25px}.block.muted{background:rgba(11,29,53,.65);box-shadow:none}.group-choice{display:flex;flex-wrap:wrap;gap:10px}.group-chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:11px;color:#dcecf8;background:#0c2443;padding:10px 14px;font-weight:700;min-height:44px}.group-chip.on{background:rgba(68,211,223,.16);border-color:var(--cyan);color:white}.tiny-dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--group-color,#8ad)}.status-row{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:18px 0 25px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#15304f;border-radius:999px;padding:6px 12px;color:#cde4ee;font-size:12px}.pill.good{background:rgba(38,121,87,.19);border-color:#53be9570;color:#b6f8d7}.pill.urgent{background:rgba(148,73,53,.17);border-color:#fc9f6570;color:#ffd7b8}
    .step-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px;align-items:start;padding-top:34px}.step-main {min-width:0}.step-aside {position:sticky;top:25px}
    .back-link{color:var(--cyan);background:none;border:0;padding:9px 0;font-weight:700;display:inline-flex;align-items:center;gap:8px;margin-bottom:18px}

    .progress-track{height:8px;background:#183c5d;border-radius:20px;overflow:hidden;margin:10px 0 20px}.progress-fill{height:100%;background:linear-gradient(90deg,#4ad9e7,#7fe4bc);border-radius:20px;transition:width .22s}
    .step-box{background:linear-gradient(135deg,rgba(22,53,85,.95),rgba(9,31,55,.96));border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow);min-height:360px}.step-tag{font-size:12px;letter-spacing:.03em;color:var(--cyan);font-weight:800;margin-bottom:12px}.step-box h2{font-size:clamp(24px,2.7vw,32px);margin:0 0 14px;line-height:1.38}.step-text{color:#e2eef7;font-size:18px;line-height:1.85}.step-note{font-size:13px;color:var(--muted);margin-top:13px}.hint-list{display:grid;gap:10px;margin:20px 0 25px}.hint-list>div{display:flex;gap:10px;align-items:flex-start;background:#092643;border:1px solid rgba(112,188,218,.13);border-radius:12px;padding:13px 15px;color:#dfebf7}.bullet-num{flex:0 0 23px;height:23px;display:grid;place-items:center;border-radius:50%;background:#1b6d88;color:#fff;font-size:12px;font-weight:800;margin-top:2px}
    .options{display:grid;gap:11px;margin:21px 0}.option{width:100%;display:flex;text-align:right;align-items:center;gap:13px;min-height:59px;background:#08243f;border:1px solid rgba(166,216,239,.21);border-radius:12px;color:#eff9ff;padding:13px 16px;transition:background .16s,border-color .16s}.option:hover{background:#113b5b}.option.selected{border-color:var(--cyan);background:#144963}.option .opt-label{flex:0 0 30px;height:30px;border:1px solid rgba(255,255,255,.22);border-radius:10px;display:grid;place-items:center;font-weight:800;color:var(--cyan)}.option.selected .opt-label{background:var(--cyan);color:#05263a}
    .feedback{margin:19px 0 0;padding:17px 19px;border-radius:12px;border:1px solid #6de0aa70;background:rgba(34,128,90,.18);color:#dcffeb}.feedback.bad{border-color:#ff9c7770;background:rgba(148,70,52,.2);color:#ffe2ce}.feedback strong{display:block;margin-bottom:5px}.spinner{display:inline-block;width:17px;height:17px;border:2px solid #176688;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .aside-card{background:rgba(9,32,56,.93);border:1px solid var(--line);border-radius:17px;padding:20px;margin-bottom:13px}.aside-card h3{font-size:15px;margin-bottom:11px}.aside-card p,.aside-card li{font-size:13px;color:var(--muted)}.approval-list{display:grid;gap:8px}.approval-item{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:7px 0;font-size:13px}.approval-item:last-child{border-bottom:0}.circle-num{width:25px;height:25px;border-radius:50%;background:#164264;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--cyan)}.circle-num.complete{background:#2b9267;color:white}
    .sort-chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin:20px 0}.sort-chip{font-size:14px;border:1px solid rgba(88,192,220,.3);background:#082a4b;padding:15px 10px;color:white;border-radius:13px;min-height:86px}.sort-chip.used{opacity:.28;pointer-events:none}.sequence{border:1px dashed rgba(103,218,225,.43);border-radius:14px;padding:16px;display:flex;flex-wrap:wrap;gap:8px;min-height:74px;margin-bottom:14px}.seq-item{border:1px solid #54ddedaa;background:rgba(52,162,181,.17);color:white;border-radius:10px;padding:9px 12px}.seq-index{color:var(--gold);font-weight:800;margin-left:6px}

    .video-wrap{background:#06111e;border:1px solid var(--line);border-radius:15px;overflow:hidden;margin:20px 0}.video-wrap video{width:100%;max-height:360px;display:block;background:black}.alert-panel{background:linear-gradient(120deg,#482b35,#233454);border:1px solid rgba(255,144,107,.41);border-radius:16px;padding:22px;display:flex;align-items:flex-start;gap:14px;margin:20px 0}.alert-panel .warn-icon{font-size:32px}.alert-panel strong{color:#ffe3bd;font-size:18px}
    .completion {text-align:center;padding:28px}.completion .icon{font-size:55px;margin-bottom:10px}.completion h2{color:#bcffe0}.completion p{color:var(--muted);max-width:580px;margin:0 auto 24px}
    .metric{border:1px solid var(--line);background:rgba(17,45,75,.89);border-radius:17px;padding:19px}.metric .value{font-size:34px;font-weight:900;letter-spacing:-.035em;line-height:1.3}.metric .label{color:var(--muted);font-size:13px}.metric .meta{color:#79cbd8;font-size:11px;margin-top:7px}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:rgba(13,36,63,.93)}table{border-collapse:collapse;width:100%;min-width:710px;text-align:right}th,td{padding:13px 16px;border-bottom:1px solid rgba(161,206,228,.12);font-size:13px}th{background:rgba(34,74,106,.66);color:#d6e9f6;font-weight:800}tr:last-child td{border-bottom:0}.check{display:inline-flex;align-items:center;justify-content:center;background:#1d7b5e;color:#ddffeb;border-radius:7px;width:25px;height:25px;font-weight:900}.uncheck{color:#69829a}
    .chart-row{display:flex;gap:12px;align-items:center;margin:13px 0}.chart-name{width:94px;flex:0 0 94px;font-size:13px;color:#d5e7f3}.chart-bar{flex:1;height:14px;border-radius:12px;background:#173858;overflow:hidden}.chart-bar>i{display:block;height:100%;background:linear-gradient(90deg,#34bad1,#7bdbba);border-radius:12px}.chart-n{width:62px;font-size:13px;color:var(--muted);text-align:left}
    .two-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel-title{font-size:20px;margin:0 0 14px}.empty{padding:35px;text-align:center;border:1px dashed rgba(143,206,240,.28);border-radius:15px;color:var(--muted)}
    .modal-cover{position:fixed;z-index:50;inset:0;background:rgba(2,9,19,.79);display:grid;place-items:center;padding:15px;backdrop-filter:blur(7px)}.modal{background:#112b4a;color:#eef9ff;border:1px solid rgba(132,205,225,.34);border-radius:21px;padding:25px;width:min(100%,640px);max-height:89vh;overflow:auto;box-shadow:0 30px 90px #0009}.modal h2{font-size:25px;margin:4px 0 16px}.input-row{margin:15px 0}.input-row label{display:block;margin-bottom:7px;font-size:13px;font-weight:700;color:#c9e2f3}.input-row input,.input-row textarea,.input-row select{width:100%;min-height:45px;background:#071e38;color:white;border:1px solid rgba(153,200,223,.36);border-radius:12px;padding:11px 14px;text-align:right;direction:rtl}.input-row input[type=url]{direction:ltr;text-align:left;font:12px monospace}.input-row textarea{min-height:120px;resize:vertical}.help{font-size:12px;color:#b9d0df}.steps-help{counter-reset:s;display:grid;gap:10px;padding:0}.steps-help li{list-style:none;background:#09233e;border:1px solid rgba(143,206,240,.16);border-radius:10px;padding:12px 14px}.steps-help li:before{counter-increment:s;content:counter(s) ". ";font-weight:900;color:var(--cyan)}
    .toast{position:fixed;z-index:90;bottom:18px;left:18px;background:#174365;border:1px solid #6bd5ed80;padding:13px 18px;border-radius:12px;max-width:330px;box-shadow:var(--shadow)}.toast.bad{border-color:#ff8585;background:#54313e}.footer{color:#7898b3;border-top:1px solid var(--line);padding:25px 0;margin-top:64px;font-size:12px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}

    /* עיצוב אופקי ייעודי לטאבלטים: חמש תחנות בשורה, מסך שאלה רחב ולוח התקדמות צר. */

      .station-info p{font-size:11px;margin:4px 0 9px;min-height:33px}
      .station-card .small-btn{font-size:12px;min-height:41px;padding:8px 5px}
      .step-layout{grid-template-columns:minmax(0,1fr) 222px;gap:14px;padding-top:17px}

      .step-head h1{font-size:clamp(24px,3vw,35px);margin:3px 0}
      .back-link{margin-bottom:9px}
      .step-box{padding:20px 23px;min-height:270px}

      .btn{min-height:46px;padding:11px 18px}
      .body-map{grid-template-columns:180px minmax(0,1fr);gap:12px}
      .sort-chips{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
      .sort-chip{font-size:13px;min-height:70px;padding:10px 7px}
      .aside-card{padding:15px}
    }
    @media (orientation:landscape) and (min-width:800px) and (max-height:720px) {
      .top{min-height:57px}
      .hero{padding-top:14px}
      .hero-art{min-height:185px}
      .moon{width:min(68%,193px)}
      .hero .lead{line-height:1.45}
      .section-head{margin:4px 0 9px}
      .station-info p{min-height:0}
      .step-head img{width:62px;height:62px}
      .step-box{padding:16px 20px}
    }
    /* טלפון המוחזק לרוחב: יותר עמודות, בלי לצמצם את אזורי הלחיצה. */
    @media (orientation:landscape) and (min-width:640px) and (max-width:799px) {
      .station-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
      .hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:12px;padding:18px 0}
      .hero-art{min-height:180px;margin-top:0}
      .moon{width:160px}
      .hero h1{font-size:37px}
      .hero .lead{font-size:15px;line-height:1.55}
      .step-layout{display:grid;grid-template-columns:minmax(0,1fr) 178px;gap:12px}
      .step-aside{position:static;margin-top:0}
      .step-box{padding:17px}
      .body-map{grid-template-columns:145px 1fr}
      .sort-chips{grid-template-columns:repeat(3,minmax(0,1fr))}
    }
    /* בטאבלט במצב אנכי תופיע בקשה להטות לרוחב, אך אפשר להמשיך אם צריך. */
    .rotate-notice{display:none}
    @media (orientation:portrait) and (min-width:600px) and (pointer:coarse) {
      .rotate-notice:not([hidden]){display:flex;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;padding:30px;background:rgba(5,15,35,.96);text-align:center}
      .rotate-card{max-width:530px;padding:33px;border:1px solid rgba(87,217,233,.5);border-radius:24px;background:#102c4d;color:#fff;box-shadow:0 20px 70px rgba(0,0,0,.5)}
      .rotate-symbol{font-size:68px;line-height:1.2;margin-bottom:10px}
      .rotate-card h2{font-size:28px;margin-bottom:10px}
      .rotate-card p{font-size:19px;line-height:1.7;color:#d0e9f7}
    }

    /* רישום שם קבוצה אחד לכל טאבלט; שימוש אופקי לאורך כל תחנות המשימה. */
    .welcome-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(345px,.9fr);gap:35px;align-items:center;min-height:calc(100vh - 240px);padding:34px 0}
    .welcome-art{position:relative;min-height:350px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;padding:20px 8px}
    .welcome-art h1{font-size:clamp(35px,4.4vw,65px);z-index:1}.welcome-art .lead{z-index:1;max-width:420px}
    .welcome-moon{position:absolute;left:0;bottom:-180px;opacity:.16;font-size:420px;color:var(--cyan);line-height:1;pointer-events:none}
    .welcome-card{max-width:570px;width:100%;padding:32px}
    .welcome-card h2{font-size:clamp(24px,3vw,33px);margin:16px 0 10px}
    .welcome-card>p{color:var(--muted);margin-bottom:23px}
    .field-label{display:block;font-weight:800;margin:0 0 9px;font-size:18px}
    #groupNameInput{width:100%;height:64px;padding:13px 18px;border-radius:14px;background:#071e38;color:var(--text);border:2px solid rgba(153,200,223,.36);font-size:21px;outline:none;text-align:right;direction:rtl}
    #groupNameInput:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(87,217,233,.18)}
    #groupForm .btn{margin-top:16px;min-height:55px}
    .single-tablet-note{margin-top:25px;padding-top:16px;border-top:1px solid var(--line);color:#aee6e9;font-size:14px;line-height:1.8}
    .single-tablet-footer{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:25px;padding:18px 20px;border:1px solid var(--line);border-radius:15px;background:rgba(11,29,53,.65)}
    .single-tablet-footer p{font-size:13px;color:var(--muted);margin:5px 0 0}
    .single-tablet-footer button{flex-shrink:0}
    @media(max-width:850px){.welcome-layout{gap:18px;grid-template-columns:1fr}.welcome-art{min-height:175px;padding:6px}.welcome-art h1{margin-bottom:10px}.welcome-art .lead{margin-bottom:0}.welcome-moon{font-size:280px;bottom:-145px}.welcome-card{max-width:unset;padding:24px}.single-tablet-footer{align-items:flex-start;flex-direction:column}}
    @media(orientation:landscape) and (min-width:800px) and (max-height:720px){.welcome-layout{min-height:calc(100vh - 135px);padding:13px 0}.welcome-art{min-height:230px}.welcome-card{padding:22px}.welcome-card h2{margin:8px 0 6px}.welcome-card>p{margin-bottom:12px}.single-tablet-note{margin-top:12px;padding-top:10px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>

 {type:'question',id:'S5Q5',title:'איזו הודעה יש להעביר לצוות החילוץ הרפואי?',text:'בסרטון האסטרונאוט אינו יכול לעמוד, ובשקפים נראה ממצא חשוד.',choices:[['a','החליפה אטומה ולכן אפשר לבקש ממנו ללכת'],['b','יש חשד לפגיעה בעצם השוק; נדרשת הערכה מקצועית ופינוי שאינו מחייב דריכה'],['c','הצילום מחליף טיפול ואין צורך בצוות רפואי']],hint:'הצליבו את הדיווח מהאנימציה עם הממצא בשקפים — בלי להכריז על אבחנה ודאית.',success:'כל הכבוד. תכננתם פינוי זהיר והעברתם לצוות המוסמך מידע רפואי רלוונטי.'},
 {type:'question',id:'S5Q6',optional:true,title:'אתגר: האם אפשר לקבוע שבר ודאי?',choices:[['a','לא. אלו הדמיות הוראה, ובמציאות נדרש פענוח רפואי מקצועי ונתונים נוספים'],['b','כן, כל קו כהה מוכיח שבר ודאי'],['c','כן, מפני שהאסטרונאוט נמצא על הירח']],hint:'הפרידו בין ראיה שמעלה חשד לבין אבחנה רפואית.',success:'יפה. חשיבה רפואית מדויקת דורשת גם לדעת מה עדיין לא ידוע.'},
 {type:'finish',title:'אישור הפינוי הרפואי',text:'פענחתם את מצב האסטרונאוט מהאנימציה, השוויתם שני שקפים ותכננתם פינוי בלי לאבחן בעצמכם.',approval:'דוח הפציעה ותוכנית הפינוי אושרו'}
]};
const STORAGE_PROGRESS='technoda_lunar_one_group_v3';
const root=document.getElementById('app');
const escapeHTML=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const htxt=v=>escapeHTML(v).replace(/\n/g,'<br>');
function loadJSON(key,alternative){try{return JSON.parse(localStorage.getItem(key))||alternative}catch{return alternative}}
function saveJSON(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch{return false}}
const emptyProgress=()=>({name:'',approvals:[],solved:[],steps:{}});
let store=loadJSON(STORAGE_PROGRESS,null);
if(!store||typeof store!=='object'||typeof store.name!=='string'||
   !Array.isArray(store.approvals)||!Array.isArray(store.solved)||
   !store.steps||typeof store.steps!=='object') store=emptyProgress();
const state={page:store.name.trim()?'home':'welcome',stationId:1,step:0,selection:'',selectedOrder:[],feedback:null,correctPending:false,videoWatched:false,modal:'',toast:''};
function groupData(){return store}
function groupName(){return store.name||'צוות המשימה'}
function persist(){saveJSON(STORAGE_PROGRESS,store)}
function approvals(){return store.approvals}
function isSolved(id){return store.solved.includes(id)}
function correctAnswer(questionId,answer){return ANSWER_KEYS[questionId]===answer}
function isQuestion(step){return ['question','sort','hotspot'].includes(step.type)}
function storeStep(){store.steps[state.stationId]=state.step;persist()}
function resetQuestion(){state.selection='';state.selectedOrder=[];state.feedback=null;state.correctPending=false;state.videoWatched=false}
function nextStep(){state.step=Math.min(state.step+1,FLOW[state.stationId].length-1);resetQuestion();storeStep();render();window.scrollTo({top:0,behavior:'smooth'})}
function registerGroup(){
 const input=document.getElementById('groupNameInput');
 const name=String(input?.value||'').trim().replace(/\s+/g,' ');
 if([...name].length<2||[...name].length>40){showToast('הקלידו שם קבוצה באורך 2 עד 40 תווים.',true);input?.focus();return}
 if(store.name){showToast('שם הקבוצה כבר נשמר בטאבלט הזה.',true);return}
 store=emptyProgress();store.name=name;persist();
 state.page='home';state.modal='';resetQuestion();render();window.scrollTo(0,0);
 showToast('ברוכים הבאים, '+name+'! המשימה מתחילה.');
}
function restartForNewGroup(){
 store=emptyProgress();persist();state.page='welcome';state.stationId=1;state.step=0;state.modal='';resetQuestion();render();window.scrollTo(0,0);
 showToast('הטאבלט מוכן לקבוצה חדשה.');
}
function openStation(id){if(!store.name){state.page='welcome';render();return}if(!FLOW[id])return;state.stationId=id;state.step=Math.max(0,Math.min(Number(store.steps[id]||0),FLOW[id].length-1));resetQuestion();state.page='station';render();window.scrollTo(0,0)}
function showToast(msg,bad=false){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast'+(bad?' bad':'');el.setAttribute('role','status');el.textContent=msg;document.body.append(el);window.setTimeout(()=>el.remove(),4200)}
function submitAnswer(){
 const item=FLOW[state.stationId][state.step];if(!item||!isQuestion(item)||state.correctPending)return;
 const answer=item.type==='sort'?state.selectedOrder.join('|'):state.selection;
 if(!answer||(item.type==='sort'&&state.selectedOrder.length!==item.items.length))return;
 const success=correctAnswer(item.id,answer);
 state.feedback={correct:success,text:success?item.success:item.hint};state.correctPending=success;
 if(success&&!isSolved(item.id)){groupData().solved.push(item.id);persist()}
 render();if(!success)showToast('קיבלתם רמז. אפשר לנסות שוב.');
}
function approveStation(){
 const station=state.stationId;
 if(!REQUIRED[station].every(isSolved)){showToast('צריך להשלים את שאלות החובה כדי לקבל אישור.',true);return}
 if(!approvals().includes(station))groupData().approvals.push(station);
 groupData().approvals.sort();groupData().steps[station]=FLOW[station].length-1;persist();
 state.page='home';resetQuestion();render();window.scrollTo({top:0,behavior:'smooth'});showToast('אישור תחנה '+station+' התקבל!');
}
function header(){return `<header class="top"><a class="brand" href="#" data-action="home" aria-label="חזרה למרכז הבקרה"><span class="mark" aria-hidden="true">${'<b></b>'.repeat(9)}</span><span><span class="brand-title">טכנודע</span><span class="brand-sub">משימת חילוץ ירחי • מרכז הבקרה</span></span></a><nav class="header-actions" aria-label="ניווט"><span class="connect live">✦ משימת תלמידים</span><button class="ghost-btn ${state.page==='home'?'active':''}" data-action="home">חמש התחנות</button><button class="ghost-btn" data-action="mission-brief">תדרוך</button></nav></header>`}
function footer(){return `<footer class="footer"><span>טכנודע • חמש תחנות חקר • משימת חילוץ עצמאית</span><span>גרסה ${APP_VERSION} • ההתקדמות נשמרת בטאבלט זה בלבד</span></footer>`}
function renderWelcome(){return `<section class="welcome-layout" aria-label="רישום שם הקבוצה">
  <div class="welcome-art"><div class="eyebrow">TECHNODA / LUNAR RESCUE</div><h1>ברוכים הבאים<br><span class="accent">למבצע החילוץ!</span></h1><p class="lead">אתם צוות משימה ירחית. לפניכם חמש תחנות של חקר, התנסות ופענוח ראיות.</p><div class="welcome-moon" aria-hidden="true">☾</div></div>
  <div class="block welcome-card"><span class="pill good">שלב ראשון • רישום הצוות</span><h2>איך קוראים לקבוצה שלכם?</h2><p>בחרו שם לקבוצה והקלידו אותו כאן. השם ילווה אתכם לאורך כל חמש התחנות.</p>
  <form id="groupForm" autocomplete="off"><label class="field-label" for="groupNameInput">שם הקבוצה</label><input id="groupNameInput" name="groupName" type="text" required minlength="2" maxlength="40" placeholder="למשל: חוקרי הגלקסיה" autocomplete="off" spellcheck="false" aria-describedby="groupHelp"><p id="groupHelp" class="step-note">השם וההתקדמות נשמרים רק בטאבלט הזה.</p><button class="btn" type="submit">ממשיכים למשימת החילוץ ←</button></form>
  <div class="single-tablet-note">✦ הטאבלט הזה יישאר עם הקבוצה שלכם בכל חמש התחנות. אין צורך בקודי מעבר או במכשיר נוסף.</div></div>
</section>`}
function approvalDisplay(){return `<div class="approval-list">${META.map(x=>`<div class="approval-item"><span>${escapeHTML(x.label)}</span><span class="circle-num ${approvals().includes(x.id)?'complete':''}">${approvals().includes(x.id)?'✓':x.id}</span></div>`).join('')}</div>`}
function renderHome(){const count=approvals().length;return `<section class="hero"><div><div class="eyebrow">TECHNODA / LUNAR RESCUE</div><h1>מבצע <span class="accent">חילוץ ירחי.</span></h1><p class="lead">אסטרונאוט נפצע על הירח. אתם צוות החילוץ המדעי! צפו באנימציות, בצעו משימות עם ציוד אמיתי, פענחו רמזים וקבלו החלטות שיקבעו אם מבצע החילוץ יצליח.</p><div class="hero-actions"><button class="btn" data-action="scroll-stations">יוצאים למשימה ←</button><button class="btn secondary" data-action="mission-brief">תדרוך המשימה</button></div><div class="stats"><div class="stat"><strong>05</strong><span>תחנות מחקר</span></div><div class="stat"><strong>${String(count).padStart(2,'0')}</strong><span>אישורים שנאספו</span></div><div class="stat"><strong>100%</strong><span>למידה עצמאית</span></div></div></div><div class="hero-art" aria-hidden="true"><span class="orb"></span><span class="orb two"></span><span class="moon"></span><span class="sat">✦</span><span class="orbit-label">LUNAR MISSION</span></div></section>
<section class="block muted" aria-label="פרטי הקבוצה"><div class="status-row"><div><h2 style="font-size:21px;margin:0 0 6px">צוות ${escapeHTML(groupName())}</h2><p style="color:var(--muted);font-size:14px;margin:0">אותו טאבלט מלווה את הקבוצה שלכם לאורך כל חמש התחנות. אפשר להתחיל מכל תחנה, בכל סדר.</p></div><span class="pill good">ההתקדמות נשמרת בטאבלט זה</span></div><div class="status-row" style="margin-bottom:0"><span style="font-size:14px;color:var(--muted)">אישורי חילוץ: ${count} מתוך 5</span></div><div class="progress-track" style="margin-bottom:0"><div class="progress-fill" style="width:${count*20}%"></div></div></section>
<section id="stations"><div class="section-head"><div><div class="eyebrow" style="margin:27px 0 9px">חמש משימות, חילוץ אחד</div><h2>בחרו תחנה והתחילו לחקור</h2><p>בכל תחנה תצפו באנימציה, תבצעו ניסוי ותענו בטאבלט.</p></div><button class="ghost-btn" data-action="finale">${count===5?'כל האישורים נאספו ✓':'קוד החילוץ: '+count+'/5'}</button></div><div class="station-grid">${META.map(s=>`<article class="station-card ${approvals().includes(s.id)?'completed':''}"><div class="station-cover"><img src="${IMAGES[s.id]}" alt="איור תחנה ${s.id}: ${escapeHTML(s.label)}" loading="lazy"><span class="station-num">0${s.id}</span>${approvals().includes(s.id)?'<span class="done-dot">✓ אושרה</span>':''}</div><div class="station-info"><strong>${escapeHTML(s.name)}</strong><p>${escapeHTML(s.sub)}</p><button class="small-btn" data-action="open-station" data-value="${s.id}">${approvals().includes(s.id)?'צפייה חוזרת':'כניסה לתחנה'} ←</button></div></article>`).join('')}</div></section>
<section class="single-tablet-footer" aria-label="הנחיות לשימוש בטאבלט"><div><strong>מסיימים את חמש המשימות באותו טאבלט.</strong><p>השם והאישורים של ${escapeHTML(groupName())} יישמרו גם אם תרעננו את הדף. רק לאחר סיום הפעילות, אפשר להכין את הטאבלט לקבוצה אחרת.</p></div><button class="ghost-btn" data-action="restart-group">הכנה לקבוצה חדשה</button></section>`}
function progressAside(){return `<aside class="step-aside"><div class="aside-card"><h3>סטטוס חילוץ</h3><p>${escapeHTML(groupName())}<br>אישורים שהתקבלו: ${approvals().length}/5</p>${approvalDisplay()}</div><div class="aside-card"><h3>איך פועלים?</h3><p>1. קוראים את ההוראות בטאבלט.<br>2. צופים במסך הגדול.<br>3. בודקים את הציוד שעל השולחן.<br>4. עונים ומקבלים משוב.</p><p style="color:#8de3d5">המשימה מתקדמת לפי מה שראיתם באנימציה ובניסוי.</p></div></aside>`}
function renderFeedback(){if(!state.feedback)return '';return `<div role="status" class="feedback ${state.feedback.correct?'':'bad'}"><strong>${state.feedback.correct?'✓ תשובה נכונה':'עוד לא, נסו שוב'}</strong><span>${escapeHTML(state.feedback.text)}</span></div>`}
function stepQuestion(s){const selected=state.selection,done=Boolean(state.correctPending||isSolved(s.id));return `<div class="step-tag">${s.optional?'שאלת אתגר • אפשר לדלג':'שאלת חובה'}</div><h2>${escapeHTML(s.title)}</h2>${s.text?`<p class="step-text">${htxt(s.text)}</p>`:''}<div class="options" role="radiogroup" aria-label="בחירת תשובה">${(s.choices||[]).map(([v,label],i)=>`<button type="button" class="option ${selected===v?'selected':''}" role="radio" aria-checked="${selected===v}" data-action="choose" data-value="${escapeHTML(v)}"><span class="opt-label">${String.fromCharCode(1488+i)}</span><span>${escapeHTML(label)}</span></button>`).join('')}</div>${renderFeedback()}<div class="actions" style="margin-top:22px">${done?`<button class="btn" data-action="next">ממשיכים ←</button>`:`<button class="btn" data-action="submit-answer" ${!selected?'disabled':''}>בדיקת תשובה</button>`}${s.optional?`<button class="btn secondary" data-action="skip-optional">דלגו על האתגר</button>`:''}</div>`}
function renderSort(s){const used=state.selectedOrder,done=Boolean(state.correctPending||isSolved(s.id));return `<div class="step-tag">פענוח אנימציה • שאלת חובה</div><h2>${escapeHTML(s.title)}</h2><p class="step-text">${escapeHTML(s.text)}</p><div class="sort-chips">${s.items.map(([id,label])=>`<button class="sort-chip ${used.includes(id)?'used':''}" data-action="sort-add" data-value="${id}">${escapeHTML(label)}</button>`).join('')}</div><div class="sequence" aria-label="סדר הבחירה">${used.length?used.map((id,i)=>`<button class="seq-item" data-action="sort-remove" data-value="${id}"><span class="seq-index">${i+1}.</span>${escapeHTML(s.items.find(x=>x[0]===id)?.[1]||'')} ✕</button>`).join(''):'בחרו תחילה את הכרטיס שהופיע ראשון...'}</div>${renderFeedback()}<div class="actions">${done?`<button class="btn" data-action="next">ממשיכים ←</button>`:`<button class="btn" data-action="submit-answer" ${used.length!==s.items.length?'disabled':''}>בדיקת הרצף</button>`}<button class="btn secondary" data-action="sort-clear">נקה סדר</button></div>`}
function renderHotspot(s){const selected=state.selection,done=Boolean(state.correctPending||isSolved(s.id));return `<div class="step-tag">זיהוי מיקום • שאלת חובה</div><h2>${escapeHTML(s.title)}</h2><p class="step-text">${escapeHTML(s.text)}</p><div class="body-map"><svg viewBox="0 0 175 300" role="img" aria-label="איור אסטרונאוט ללא סימון הפגיעה" xmlns="http://www.w3.org/2000/svg"><circle cx="88" cy="43" r="28" fill="#214768" stroke="#8fd3eb" stroke-width="5"/><path d="M58 84 Q88 73 118 84 L127 159 Q88 171 49 159 Z" fill="#214768" stroke="#8fd3eb" stroke-width="5"/><path d="M49 92L25 153L11 148L34 86ZM127 92L151 153L164 147L140 86Z" fill="#214768" stroke="#8fd3eb" stroke-width="4"/><path d="M58 157L52 256L75 260L88 178L100 260L123 256L117 157" fill="#214768" stroke="#8fd3eb" stroke-width="5"/><path d="M52 257L45 275L78 275L77 259M100 259L97 275L130 275L123 257" fill="#718da8" stroke="#a7dfec" stroke-width="3"/><path d="M68 38Q88 23 107 38" stroke="#cde8f2" stroke-width="3" fill="none"/><circle cx="88" cy="127" r="10" fill="#64cddd" opacity=".55"/></svg><div class="body-picks">${s.choices.map(([v,label])=>`<button class="option ${selected===v?'selected':''}" role="radio" aria-checked="${selected===v}" data-action="choose" data-value="${v}">${escapeHTML(label)}</button>`).join('')}</div></div>${renderFeedback()}<div class="actions">${done?`<button class="btn" data-action="next">ממשיכים ←</button>`:`<button class="btn" data-action="submit-answer" ${!selected?'disabled':''}>בדיקת התשובה</button>`}</div>`}
function stepStatic(s){const type=s.type,special=type==='alert',fin=type==='finish';return `<div class="step-tag">${escapeHTML(s.tag||'מרכז הבקרה')}</div><h2>${escapeHTML(s.title)}</h2>${special?`<div class="alert-panel"><div class="warn-icon" aria-hidden="true">⚠</div><div><strong>עדכון קריטי מהמשימה</strong><p style="margin:8px 0 0">${htxt(s.text||'')}</p></div></div>`:`<p class="step-text">${htxt(s.text||'')}</p>`}${Array.isArray(s.items)?`<div class="hint-list">${s.items.map((t,i)=>`<div><span class="bullet-num">${i+1}</span><span>${htxt(t)}</span></div>`).join('')}</div>`:''}${type==='info'?`<div class="pill urgent" style="margin:12px 0 20px">זמני הנסיעה מחושבים מראש</div>`:''}${type==='video'?`<div class="video-wrap"><video id="cameraVideo" playsinline controls preload="metadata" src="${escapeHTML(s.src)}">הדפדפן אינו תומך בנגן וידאו.</video></div><div class="step-note">הסרטון מוצג רק כאן, בטאבלט שלכם, אחרי שפתרתם את השאלה הקודמת.</div>`:''}${fin?`<div class="completion"><div class="icon">✦</div><h2>${escapeHTML(s.approval)}</h2><p>אישור התחנה יצורף למשימה של ${escapeHTML(groupName())}.</p></div>`:''}<div class="actions" style="margin-top:23px">${fin?`<button class="btn" data-action="approve">אישור התחנה וחזרה למרכז הבקרה ✓</button>`:`<button class="btn" data-action="next" ${type==='video'&&!state.videoWatched?'disabled':''}>${escapeHTML(s.button||'ממשיכים')} ←</button>`}${type==='video'?`<button class="btn secondary" data-action="video-watched">צפינו בסרטון במלואו</button>`:''}</div>`}
function renderStation(){const station=META[state.stationId-1],flow=FLOW[state.stationId],step=flow[state.step];const num=state.step+1;return `<div class="step-layout"><main class="step-main"><button class="back-link" data-action="home">→ חזרה לחמש התחנות</button><div class="step-head"><img src="${IMAGES[station.id]}" alt="אייקון תחנה ${station.id}"><div><span class="pill">תחנה ${station.id} מתוך 5</span><h1>${escapeHTML(station.name)}</h1><p>${escapeHTML(station.label)}</p></div></div><div class="status-row" style="margin:0"><span class="pill">שלב ${num} מתוך ${flow.length}</span><span class="pill">${escapeHTML(groupName())}</span></div><div class="progress-track"><div class="progress-fill" style="width:${Math.max(5,Math.round(num/flow.length*100))}%"></div></div><section class="step-box">${step.type==='question'?stepQuestion(step):step.type==='sort'?renderSort(step):step.type==='hotspot'?renderHotspot(step):stepStatic(step)}</section></main>${progressAside()}</div>`}
function renderFinale(){const n=approvals().length,ready=n===5;return `<div class="hero" style="padding-top:45px"><div><div class="eyebrow">MISSION COMPLETION</div><h1>${ready?'כל האישורים <span class="accent">נאספו!</span>':'קוד החילוץ <span class="accent">עדיין נעול.</span>'}</h1><p class="lead">${ready?'השלמתם את חמש המשימות! מרכז הבקרה קיבל את תוכניתכם, כולל התרעת החמצן. לאחר בדיקת פתרון החירום והאישור הרפואי אפשר להפעיל את מבצע החילוץ.':'עוד לא נאספו חמשת האישורים. חזרו לתחנות שלא הושלמו ופתרו את שאלות החובה.'}</p><div class="actions">${ready?'<button class="btn" data-action="launch-rescue">הפעלת חילוץ 🚀</button>':'<button class="btn" data-action="home">חזרה לתחנות ←</button>'}</div></div><div class="hero-art"><span class="orb"></span><span class="moon"></span><span class="orbit-label">RESCUE PROTOCOL • ${n}/5</span></div></div><section class="block muted"><h2 style="font-size:21px">אישורי המשימה</h2>${approvalDisplay()}</section>`}
function renderSuccess(){return `<section class="completion" style="padding:70px 15px"><div style="font-size:65px">🚀</div><div class="eyebrow">MISSION ACCOMPLISHED</div><h1>משימת החילוץ <span class="accent">הושלמה!</span></h1><p class="lead" style="margin:0 auto 22px">תכננתם דרך, פענחתם את מיקום האסטרונאוט, הבנתם כיצד פועלת תקשורת, פתרתם בעיית תאורה ופענחתם מידע רפואי. בזכות החקר והראיות, צוות החילוץ השלים את המשימה.</p><div class="actions" style="justify-content:center"><button class="btn" data-action="home">חזרה לחמש התחנות</button></div></section>`}
function renderModal(){if(!state.modal)return '';let content='';if(state.modal==='brief')content=`<h2>תדרוך מבצע החילוץ</h2><p class="step-text">אתם צוות מחקר בטכנודע. בכל תחנה יש אנימציה על המסך הגדול, משימה פיזית על השולחן ושאלות בטאבלט.</p><div class="hint-list"><div>🔭 צופים באנימציה ומחפשים ראיות.</div><div>🧪 מתנסים בדגם או בציוד שעל השולחן.</div><div>🧭 מקבלים רמז במקרה של תשובה שגויה וחוזרים לבדוק.</div><div>🎯 משלימים חמש תחנות כדי להפעיל את החילוץ.</div></div><button class="btn" data-action="close-modal">מוכנים למשימה ←</button>`;
if(state.modal==='restart')content=`<h2>להכין את הטאבלט לקבוצה חדשה?</h2><p class="step-text">פעולה זו תמחק מהטאבלט את השם ואת חמשת האישורים של <strong>${escapeHTML(groupName())}</strong> כדי שקבוצה אחרת תוכל להתחיל מההתחלה.</p><p class="step-note">אין שמירת תשובות בשרת, ולא ניתן לשחזר התקדמות שנמחקה. ודאו שהקבוצה סיימה קודם את הפעילות.</p><div class="actions"><button class="btn danger" data-action="confirm-restart">כן, מתחילים עם קבוצה חדשה</button><button class="btn secondary" data-action="close-modal">ביטול</button></div>`;
return `<div class="modal-cover" role="presentation" data-action="backdrop"><div role="dialog" aria-modal="true" aria-label="חלונית משימה" class="modal"><button class="ghost-btn" style="float:left" data-action="close-modal" aria-label="סגירה">✕</button>${content}</div></div>`}
function render(){const page=state.page==='welcome'?renderWelcome():state.page==='home'?renderHome():state.page==='station'?renderStation():state.page==='finale'?renderFinale():renderSuccess();root.innerHTML=header()+page+footer()+renderModal();if(state.page==='station'&&FLOW[state.stationId][state.step]?.type==='video'){const v=document.getElementById('cameraVideo');if(v)v.addEventListener('ended',()=>{state.videoWatched=true;const button=document.querySelector('[data-action="next"]');if(button)button.disabled=false},{once:true})}}
function launchRescue(){if(approvals().length!==5){showToast('חסרים אישורים, השלימו את כל חמש התחנות.',true);return}state.page='success';render();window.scrollTo({top:0,behavior:'smooth'})}
function actionClick(event){const element=event.target.closest('[data-action]');if(!element||element.disabled)return;const action=element.dataset.action,value=element.dataset.value;
switch(action){
 case 'home':event.preventDefault();state.page=store.name?'home':'welcome';state.modal='';render();window.scrollTo({top:0});break;
 case 'mission-brief':state.modal='brief';render();break;
 case 'close-modal':state.modal='';render();break;
 case 'backdrop':if(event.target===element){state.modal='';render()}break;
 case 'scroll-stations':document.getElementById('stations')?.scrollIntoView({behavior:'smooth'});break;
 case 'open-station':openStation(Number(value));break;
 case 'choose':state.selection=value;state.feedback=null;render();break;
 case 'sort-add':if(!state.selectedOrder.includes(value))state.selectedOrder.push(value);state.feedback=null;render();break;
 case 'sort-remove':state.selectedOrder=state.selectedOrder.filter(x=>x!==value);state.feedback=null;render();break;
 case 'sort-clear':state.selectedOrder=[];state.feedback=null;render();break;
 case 'submit-answer':submitAnswer();break;
 case 'skip-optional':nextStep();break;
 case 'next':{const step=FLOW[state.stationId][state.step];if(step.type==='video'&&!state.videoWatched){showToast('צפו קודם בסרטון מצלמת הרכב בטאבלט.',true);break}nextStep();break}
 case 'video-watched':{const v=document.getElementById('cameraVideo');if(!v||v.readyState===0){showToast('הסרטון לא נטען. בדקו את החיבור ונסו שוב.',true);break}if(v.duration&&v.currentTime<Math.max(1,v.duration*.84)){showToast('יש לצפות בסרטון כמעט עד סופו.',true);break}state.videoWatched=true;render();break}
 case 'approve':approveStation();break;
 case 'finale':state.page=store.name?'finale':'welcome';render();window.scrollTo(0,0);break;
 case 'launch-rescue':launchRescue();break;
 case 'restart-group':state.modal='restart';render();break;
 case 'confirm-restart':restartForNewGroup();break;
 }}
document.addEventListener('click',actionClick);
document.addEventListener('submit',event=>{if(event.target?.id==='groupForm'){event.preventDefault();registerGroup()}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.modal){state.modal='';render()}});
window.addEventListener('storage',event=>{if(event.key===STORAGE_PROGRESS){store=loadJSON(STORAGE_PROGRESS,store);render()}});
window.addEventListener('unhandledrejection',event=>{console.error('Unhandled operation:',event.reason)});
persist();render();

  </script>
</body>
</html>
